{{ define "archive-page" }}<!doctype html>
<html lang="{{ .Lang }}">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{ .Title }}{{ if .SiteTitle }} - {{ .SiteTitle }}{{ end }}</title>
	<link rel="stylesheet" href="{{ .Stylesheet }}">
</head>
<body>
	<main class="archive-campaign">
		<p class="back"><a href="{{ .BackHref }}">&larr; {{ .BackLabel }}</a></p>

		<h1>{{ .Title }}</h1>

		{{ if .DateTime }}<p class="date"><time datetime="{{ .DateTime }}">{{ .Date }}</time></p>{{ end }}

		<div class="body">{{ .Body }}</div>
	</main>
</body>
</html>{{ end }}
